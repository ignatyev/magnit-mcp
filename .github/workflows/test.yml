name: Node tests
on:
  push:
    branches: [main, migration/utcp-direct-agent]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
      - run: npm run check
      - run: python3 -m py_compile agent.py
